<svg xmlns="http://www.w3.org/2000/svg" width="750" height="360" viewBox="0 0 750 360">
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#198754;stop-opacity:1" />
        </linearGradient>

        <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
            <feOffset dx="2" dy="4" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.15" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="750" height="360" fill="url(#bgGradient)" rx="20" ry="20" />

    <g transform="translate(120,0)">
        <!-- Main HK2 Text -->
        <text x="0" y="210"
            font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-size="140"
            font-weight="900"
            fill="#ffffff"
            letter-spacing="-3">
            HK2
        </text>

        <!-- Decorative line -->
        <line x1="280" y1="110"
            x2="280" y2="250"
            stroke="#ffffff"
            stroke-width="3"
            stroke-opacity="0.4"
            stroke-linecap="round" />

        <!-- Open Padlock Icon -->
        <g transform="translate(400,180)">
            <circle cx="0" cy="0" r="75" fill="#ffffff" filter="url(#shadow)" />

            <!-- Lock Body -->
            <rect x="-28" y="-5"
                width="56" height="42"
                rx="6"
                fill="#6f42c1" />

            <!-- Open Shackle -->
            <path d="M-10,-5
                     v-18
                     c0-16 26-16 26 0"
                fill="none"
                stroke="#6f42c1"
                stroke-width="6"
                stroke-linecap="round" />

            <!-- Keyhole -->
            <circle cx="0" cy="12" r="4" fill="#ffffff" />
            <rect x="-2" y="12" width="4" height="10" rx="2" fill="#ffffff" />
        </g>
    </g>

    <!-- Footer text -->
    <text x="375"
        y="325"
        text-anchor="middle"
        font-family="'Segoe UI', Roboto, Arial, sans-serif"
        font-size="16"
        font-weight="600"
        fill="#ffffff"
        letter-spacing="3"
        opacity="0.6">
        CSP WHITELISTING - EXTENSION MODULE
    </text>
</svg>